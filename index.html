<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistente Informes RAYEN</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0ede8;
    --surface: #ffffff;
    --surface2: #f7f5f2;
    --border: #e2ddd8;
    --accent: #2d6a4f;
    --accent2: #40916c;
    --text: #1a1a1a;
    --text2: #666;
    --text3: #999;
    --danger: #c0392b;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }

  header {
    width: 100%;
    max-width: 720px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }

  .logo {
    width: 40px; height: 40px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: white;
    font-size: 18px;
    font-weight: 600;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  header p {
    font-size: 12px;
    color: var(--text3);
    margin-top: 1px;
  }

  .card {
    background: var(--surface);
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 720px;
    overflow: hidden;
  }

  .card-section {
    padding: 24px;
    border-bottom: 1px solid var(--border);
  }

  .card-section:last-child { border-bottom: none; }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 16px;
  }

  .field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.span2 { grid-column: span 2; }

  label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text2);
  }

  input, select, textarea {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    width: 100%;
    transition: border-color 0.15s, box-shadow 0.15s;
    outline: none;
    resize: none;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--accent2);
    box-shadow: 0 0 0 3px rgba(64,145,108,0.12);
    background: white;
  }

  textarea { min-height: 90px; line-height: 1.5; }

  .btn-generate {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    letter-spacing: -0.2px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-generate:hover { background: var(--accent2); }
  .btn-generate:active { transform: scale(0.99); }
  .btn-generate:disabled { background: #aaa; cursor: not-allowed; }

  .spinner {
    width: 18px; height: 18px;
    border: 2.5px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .result-area { display: none; }

  .result-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .result-badge {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600;
    color: var(--accent);
    background: rgba(45,106,79,0.08);
    padding: 4px 10px;
    border-radius: 20px;
  }

  .result-badge::before {
    content: '';
    width: 7px; height: 7px;
    background: var(--accent);
    border-radius: 50%;
  }

  .btn-copy {
    padding: 8px 16px;
    background: transparent;
    border: 1.5px solid var(--accent);
    color: var(--accent);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    display: flex; align-items: center; gap: 6px;
  }

  .btn-copy:hover { background: var(--accent); color: white; }
  .btn-copy.copied { background: var(--accent); color: white; }

  .result-text {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    line-height: 1.7;
    color: var(--text);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 80px;
  }

  .error-msg {
    display: none;
    color: var(--danger);
    font-size: 13px;
    margin-top: 10px;
    padding: 10px 14px;
    background: rgba(192,57,43,0.06);
    border-radius: 8px;
    border-left: 3px solid var(--danger);
  }

  .api-row {
    display: flex; gap: 10px; align-items: flex-end;
  }

  .api-row .field { flex: 1; }

  .api-toggle {
    padding: 10px 14px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 12px;
    color: var(--text2);
    cursor: pointer;
    white-space: nowrap;
    height: 40px;
    display: flex; align-items: center;
    transition: all 0.15s;
  }

  .api-toggle:hover { border-color: var(--accent); color: var(--accent); }

  .footer-note {
    font-size: 11px;
    color: var(--text3);
    text-align: center;
    margin-top: 16px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">TS</div>
  <div>
    <h1>Asistente de Informes RAYEN</h1>
    <p>Generación automática de informes clínicos</p>
  </div>
</header>

<div class="card">

  <!-- API Key -->
  <div class="card-section">
    <div class="section-label">Configuración</div>
    <div class="api-row">
      <div class="field">
        <label>API Key de Anthropic</label>
        <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off">
      </div>
      <button class="api-toggle" onclick="toggleKey()">Mostrar</button>
    </div>
  </div>

  <!-- Datos del paciente -->
  <div class="card-section">
    <div class="section-label">Datos del Paciente</div>
    <div class="field-grid">
      <div class="field">
        <label>Nombre completo</label>
        <input type="text" id="nombre" placeholder="Nombre Apellido">
      </div>
      <div class="field">
        <label>RUT</label>
        <input type="text" id="rut" placeholder="12.345.678-9">
      </div>
      <div class="field">
        <label>Edad</label>
        <input type="text" id="edad" placeholder="Ej: 34 años">
      </div>
      <div class="field">
        <label>Tipo de consulta</label>
        <select id="tipo">
          <option value="">Seleccionar...</option>
          <option>Primera consulta</option>
          <option>Control</option>
          <option>Urgencia social</option>
          <option>Seguimiento</option>
          <option>Interconsulta</option>
        </select>
      </div>
      <div class="field span2">
        <label>Motivo de consulta</label>
        <textarea id="motivo" placeholder="¿Por qué viene hoy? Describa brevemente..."></textarea>
      </div>
      <div class="field span2">
        <label>Observaciones / Antecedentes relevantes</label>
        <textarea id="observaciones" placeholder="Situación familiar, antecedentes, contexto social..."></textarea>
      </div>
      <div class="field span2">
        <label>Intervención realizada</label>
        <textarea id="intervencion" placeholder="¿Qué se hizo en la consulta? Orientaciones, derivaciones, acuerdos..."></textarea>
      </div>
    </div>
  </div>

  <!-- Botón -->
  <div class="card-section">
    <button class="btn-generate" id="btnGenerar" onclick="generarInforme()">
      <div class="spinner" id="spinner"></div>
      <span id="btnTexto">Generar Informe</span>
    </button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <!-- Resultado -->
  <div class="card-section result-area" id="resultArea">
    <div class="result-header">
      <div class="result-badge">Informe generado</div>
      <button class="btn-copy" id="btnCopy" onclick="copiarTexto()">
        📋 Copiar para RAYEN
      </button>
    </div>
    <div class="result-text" id="resultText"></div>
  </div>

</div>

<p class="footer-note">Los datos ingresados no se almacenan. Uso exclusivo interno CESFAM.</p>

<script>
  function toggleKey() {
    const input = document.getElementById('apiKey');
    const btn = event.target;
    if (input.type === 'password') {
      input.type = 'text';
      btn.textContent = 'Ocultar';
    } else {
      input.type = 'password';
      btn.textContent = 'Mostrar';
    }
  }

  async function generarInforme() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const nombre = document.getElementById('nombre').value.trim();
    const rut = document.getElementById('rut').value.trim();
    const edad = document.getElementById('edad').value.trim();
    const tipo = document.getElementById('tipo').value;
    const motivo = document.getElementById('motivo').value.trim();
    const observaciones = document.getElementById('observaciones').value.trim();
    const intervencion = document.getElementById('intervencion').value.trim();

    const errorMsg = document.getElementById('errorMsg');
    errorMsg.style.display = 'none';

    if (!apiKey) {
      errorMsg.textContent = 'Por favor ingresa tu API Key de Anthropic.';
      errorMsg.style.display = 'block';
      return;
    }

    if (!nombre || !motivo) {
      errorMsg.textContent = 'Por favor completa al menos el nombre y el motivo de consulta.';
      errorMsg.style.display = 'block';
      return;
    }

    const btn = document.getElementById('btnGenerar');
    const spinner = document.getElementById('spinner');
    const btnTexto = document.getElementById('btnTexto');
    btn.disabled = true;
    spinner.style.display = 'block';
    btnTexto.textContent = 'Generando...';

    const prompt = `Eres una trabajadora social de un CESFAM chileno. Redacta un informe de atención para el sistema RAYEN con los siguientes datos:

Nombre: ${nombre}
RUT: ${rut || 'No registrado'}
Edad: ${edad || 'No registrado'}
Tipo de consulta: ${tipo || 'Consulta'}
Motivo de consulta: ${motivo}
Observaciones y antecedentes: ${observaciones || 'Sin antecedentes adicionales'}
Intervención realizada: ${intervencion || 'Se realiza atención y orientación'}

Redacta el informe en primera persona, con lenguaje técnico-social formal, usando el formato estándar de RAYEN para trabajo social en atención primaria de salud chilena. Incluye: fecha de atención, identificación del usuario, motivo de consulta, antecedentes relevantes, intervención realizada y plan de seguimiento si corresponde.`;

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          messages: [{ role: 'user', content: prompt }]
        })
      });

      const data = await response.json();

      if (data.error) {
        throw new Error(data.error.message || 'Error al conectar con Claude');
      }

      const texto = data.content[0].text;
      document.getElementById('resultText').textContent = texto;
      document.getElementById('resultArea').style.display = 'block';
      document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth', block: 'start' });

    } catch (err) {
      errorMsg.textContent = 'Error: ' + (err.message || 'No se pudo conectar. Verifica tu API Key.');
      errorMsg.style.display = 'block';
    } finally {
      btn.disabled = false;
      spinner.style.display = 'none';
      btnTexto.textContent = 'Generar Informe';
    }
  }

  function copiarTexto() {
    const texto = document.getElementById('resultText').textContent;
    navigator.clipboard.writeText(texto).then(() => {
      const btn = document.getElementById('btnCopy');
      btn.textContent = '✓ Copiado';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '📋 Copiar para RAYEN';
        btn.classList.remove('copied');
      }, 2000);
    });
  }
</script>
</body>
</html>
